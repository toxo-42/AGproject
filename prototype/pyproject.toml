[project]
name = "peob-prototype"
version = "0.1.0"
description = "페달 오조작 판정 로직 PC 프로토타입 (Chaquopy 이식 전 검증용)"
requires-python = ">=3.10"
# 외부 의존성 없음 (stdlib만 사용) -> Chaquopy 전환 리스크 최소화.
# verify_signature.py도 처음엔 cryptography를 썼다가, 제3자(경찰/보험사) 컴퓨터에서
# pip install 없이 바로 돌아가야 해서 ECDSA를 직접 구현해 stdlib만 쓰도록 바꿨다(2026-07-14).
# 판정·캘리브레이션 로직은 ../backend 의 peob 패키지(앱과 공용 원본)를 editable 로 가져온다.
dependencies = ["peob"]

[tool.uv.sources]
peob = { path = "../backend", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# src/ 의 스크립트 모듈(dataset, train_thresholds …)을 패키지 없이 바로 import
pythonpath = ["src"]
